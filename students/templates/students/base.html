<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management System{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        /* Navbar */
        .navbar {
            background: #0f2747;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Main content */
        .main-content {
            min-height: calc(100vh - 70px);
        }

        /* Mobile */
        @media (max-width: 700px) {
            .navbar {
                padding: 16px 20px;
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
        .messages {
    max-width: 1100px;
    margin: 20px auto 0;
    padding: 0 25px;
}

.message {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #bbf7d0;
    padding: 12px 15px;
    border-radius: 7px;
    font-weight: bold;
    font-size: 14px;
}
.user-info {
    color: white;
    font-size: 14px;
    margin-right: 5px;
}
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Student Management System
        </div>
        <div class="user-info">
    Welcome, <strong>{{ request.user.username }}</strong>
</div>
        <div class="nav-links">

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'student_list' %}">
                Students
            </a>

            <a href="{% url 'add_student' %}">
                Add Student
            </a>

            <form method="POST" action="{% url 'logout' %}" style="display: inline;">
    {% csrf_token %}

    <button
        type="submit"
        style="
            background: none;
            border: none;
            color: white;
            font-weight: 500;
            cursor: pointer;
            font-size: 16px;
        "
    >
        Logout
    </button>
</form>
        </div>

    </nav>

    <main class="main-content">

    {% if messages %}
        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
