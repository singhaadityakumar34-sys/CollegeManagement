{% extends "students/base.html" %}

{% block title %}
Add Student - Student Management System
{% endblock %}

{% block content %}

<style>
    .form-container {
        max-width: 950px;
        margin: 35px auto;
        padding: 0 25px 40px;
    }

    .form-header {
        margin-bottom: 25px;
    }

    .form-header h1 {
        color: #0f2747;
        margin-bottom: 6px;
    }

    .form-header p {
        color: #6b7280;
    }

    .form-card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    label {
        margin-bottom: 7px;
        font-weight: bold;
        color: #374151;
        font-size: 14px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #0f2747;
    }

    textarea {
        resize: vertical;
        min-height: 100px;
    }

    .form-actions {
        margin-top: 25px;
        display: flex;
        gap: 12px;
    }

    .btn {
        padding: 12px 22px;
        border-radius: 7px;
        text-decoration: none;
        font-weight: bold;
        border: none;
        cursor: pointer;
    }

    .save-btn {
        background: #0f2747;
        color: white;
    }

    .back-btn {
        background: #e5e7eb;
        color: #111827;
    }

    @media (max-width: 700px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: auto;
        }

        .form-card {
            padding: 20px;
        }

        .error-message {
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    padding: 12px 15px;
    border-radius: 7px;
    margin-bottom: 20px;
    font-size: 14px;
    font-weight: bold;
}

        .form-actions {
            flex-direction: column;
        }

        .btn {
            text-align: center;
        }
    }
</style>


<div class="form-container">

    <div class="form-header">
        <h1>Add Student</h1>
        <p>Enter student details to register a new student.</p>
    </div>


    <div class="form-card">
        {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
{% endif %}

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">
                    <label>Student ID</label>
                    <input
                        type="text"
                        name="student_id"
                        placeholder="Example: STU001"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Name</label>
                    <input
                        type="text"
                        name="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email address"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Phone</label>
                    <input
                        type="tel"
                        name="phone"
                        placeholder="Enter 10-digit phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Course</label>
                    <input
                        type="text"
                        name="course"
                        placeholder="Example: B.Tech Computer Science"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Semester</label>

                    <select name="semester" required>

                        <option value="">Select Semester</option>
                        <option value="1">1st Semester</option>
                        <option value="2">2nd Semester</option>
                        <option value="3">3rd Semester</option>
                        <option value="4">4th Semester</option>
                        <option value="5">5th Semester</option>
                        <option value="6">6th Semester</option>
                        <option value="7">7th Semester</option>
                        <option value="8">8th Semester</option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Gender</label>

                    <select name="gender" required>

                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Session</label>
                    <input
                        type="text"
                        name="session"
                        placeholder="Example: 2025-2029"
                        required
                    >
                </div>
                <div class="form-group">
    <label>Student Photo</label>

    <input
        type="file"
        name="photo"
        accept="image/*"
    >
</div>
<div class="form-group">
    <label>Date of Birth</label>

    <input
        type="date"
        name="date_of_birth"
        required
    >
</div>
                <div class="form-group full">
                    <label>Address</label>

                    <textarea
                        name="address"
                        placeholder="Enter complete address"
                        required
                    ></textarea>
                </div>

            </div>


            <div class="form-actions">

                <button type="submit" class="btn save-btn">
                    Save Student
                </button>

                <a
                    href="{% url 'student_list' %}"
                    class="btn back-btn"
                >
                    Back to Student List
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
